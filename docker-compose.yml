# MariaDB for WikiPilot. Start:  docker compose up -d --wait
# The image adds MariaDB's S3 storage engine (docker/Dockerfile): cold, read-only history tables
# live in an S3 bucket (IronShard) and stay queryable with ordinary SQL.
# S3 credentials come from .env (access_key, secret_key) — never written into this file.
services:
  mariadb:
    build: ./docker
    image: palimpsest-mariadb
    command:
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=1536M
      - --innodb_log_file_size=512M
      - --mhnsw_max_cache_size=1G
      - --character-set-server=utf8mb4
      - --net_read_timeout=600
      - --net_write_timeout=600
      - --plugin-load-add=ha_s3
      - --s3=ON
      - --s3-host-name=${S3_HOST:-s3.ironshard.ai}
      - --s3-bucket=${S3_BUCKET:-wikipilot}
      - --s3-access-key=${access_key}
      - --s3-secret-key=${secret_key}
      - --s3-region=${S3_REGION:-auto}
      - --s3-protocol-version=Path
      - --s3-block-size=4M
      - --s3-pagecache-buffer-size=256M
    environment:
      MARIADB_ROOT_PASSWORD: palimpsest
      MARIADB_DATABASE: palimpsest
      MARIADB_USER: palimpsest
      MARIADB_PASSWORD: palimpsest
    ports:
      - "3309:3306"
    volumes:
      - palimpsest-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 60
volumes:
  palimpsest-data:
